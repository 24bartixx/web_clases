name: chess_bros_trading

services:
  backend:
    build:
      context: ./backend
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - '8000:8000'
    depends_on:
      - db

  db:
    image: postgres:16
    env_file:
      - ./backend/.env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    environment:
      HOST: '0.0.0.0'
      PORT: '3000'
      BROWSER: 'none'
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm start"
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  frontend_node_modules:
