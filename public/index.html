<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Czat</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body>
  <div class="container">
    <div id="login-screen" class="screen active">
      <div class="login-container">
        <div class="login-box">
          <div class="login-header">
            <h1 class="app-title">💬 WebSocket Chat</h1>
          </div>
          
          <div class="login-form">
            <input 
              type="text" 
              id="username-input" 
              placeholder="Wpisz swój nick" 
              maxlength="20"
              autofocus
            >
            <button class="btn btn-primary" onclick="joinChat()">
              Dołącz do Czatu
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="chat-screen" class="screen">
      <div class="chat-layout">
        <div class="sidebar">
          <div class="sidebar-top">
            <div class="user-header">
              <div class="user-avatar">👤</div>
              <div class="user-info">
                <span id="current-username" class="username-display"></span>
              </div>
            </div>
            <div class="sidebar-buttons">
              <button class="btn-logout" id="logout-btn" onclick="logout()">Logout</button>
              <button class="btn-new-chat" onclick="createNewChat()">+</button>
            </div>
          </div>
          
          <div id="rooms-list" class="rooms-list"></div>
        </div>

        <div class="main-chat">
          <div class="chat-header">
            <div class="header-info">
              <h2 id="room-title">Wybierz czat</h2>
              <span id="users-count" class="users-count">0 uczestników</span>
            </div>
            <div class="header-user">
              <button class="btn-delete" id="delete-room-btn" title="Usuń czat" onclick="deleteChat()" style="display: none;">
                Delete
              </button>
            </div>
          </div>

          <div id="users-container" class="users-container">
            <div id="users-online" class="users-online"></div>
          </div>

          <div id="messages-container" class="messages-container">
            <div class="empty-state">
              Wybierz lub utwórz czat aby zacząć rozmowę
            </div>
          </div>

          <div id="typing-indicator" class="typing-indicator hidden">
            <span id="typing-text"></span>
          </div>

          <div class="input-area">
            <div class="input-group">
              <input 
                type="text" 
                id="message-input" 
                placeholder="Wiadomość..." 
                maxlength="500"
              >
              <button class="btn-icon" id="image-button" title="Zdjęcie">
                📸
              </button>
              <button class="btn-icon" id="send-button" title="Wyślij">
                ➤
              </button>
            </div>
            <input 
              type="file" 
              id="image-input" 
              accept="image/*" 
              style="display: none;"
            >
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Create New Chat -->
    <div id="modal-create-room" class="modal hidden">
      <div class="modal-overlay" onclick="closeCreateRoomModal()"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>Nowy Czat</h2>
          <button class="modal-close" onclick="closeCreateRoomModal()">✕</button>
        </div>
        <div class="modal-body">
          <input 
            type="text" 
            id="room-name-input" 
            placeholder="Nazwa czatu..." 
            maxlength="30"
            class="modal-input"
          >
          <p class="modal-hint">Nazwa musi zawierać przynajmniej 1 znaku</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeCreateRoomModal()">Anuluj</button>
          <button class="btn btn-primary" onclick="submitCreateRoom()">Utwórz Czat</button>
        </div>
      </div>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
